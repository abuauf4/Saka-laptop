name: Build Hostinger Package

on:
  workflow_dispatch:
  push:
    branches: [laravel-v2]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'hostinger/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'artisan'
      - '.github/workflows/build-hostinger.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, bcmath, fileinfo, openssl
          tools: composer:v2
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Verify application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          find app bootstrap config database routes public hostinger -name '*.php' -print0 | xargs -0 -n1 php -l
          php artisan route:list --except-vendor
          rm -f .env
      - name: Prepare Hostinger structure
        run: |
          rm -rf deploy
          mkdir -p deploy/saka-app deploy/public_html
          rsync -a ./ deploy/saka-app/             --exclude deploy             --exclude .git             --exclude .github             --exclude tests             --exclude public             --exclude hostinger             --exclude .env
          rsync -a public/ deploy/public_html/
          cp hostinger/index.php deploy/public_html/index.php
          cp hostinger/install.php deploy/public_html/install.php
          INSTALL_CODE="$(openssl rand -hex 16)"
          printf '%s' "$INSTALL_CODE" > deploy/saka-app/.install-token
          printf 'SAKA LAPTOP HOSTINGER INSTALL CODE\n\n%s\n\nBuka https://domain-anda/install.php lalu masukkan kode ini.\n' "$INSTALL_CODE" > deploy/INSTALL-CODE.txt
          printf 'Extract ZIP ini di folder domain Hostinger sehingga public_html dan saka-app sejajar.\nJangan pindahkan isi saka-app ke public_html.\nLalu buka /install.php.\n' > deploy/README-FIRST.txt
          cd deploy
          zip -qr ../saka-laptop-v2-hostinger.zip .
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: saka-laptop-v2-hostinger
          path: saka-laptop-v2-hostinger.zip
          retention-days: 14
